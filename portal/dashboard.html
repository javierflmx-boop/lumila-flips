<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Portal — Lumina Flips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .dash-nav{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid var(--line);}
  .dash-body{max-width:800px;margin:0 auto;padding:60px 32px;}
  .dash-empty{color:rgba(243,238,227,0.5);font-size:15px;font-weight:300;padding:60px 0;text-align:center;}
  .update-card{border:1px solid rgba(201,161,90,0.25);background:var(--char-2);padding:28px 30px;margin-bottom:20px;}
  .update-card .u-date{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--brass);margin-bottom:10px;}
  .update-card .u-title{font-family:var(--serif);font-size:22px;color:var(--cream);margin-bottom:10px;}
  .update-card .u-body{font-size:14px;color:rgba(243,238,227,0.7);font-weight:300;line-height:1.65;}
  .update-card img{margin-top:16px;width:100%;border:1px solid rgba(201,161,90,0.25);}
  .logout-btn{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(243,238,227,0.6);background:none;border:1px solid var(--line);padding:9px 18px;cursor:pointer;font-family:var(--sans);}
  .logout-btn:hover{border-color:var(--mango);color:var(--mango);}
</style>
</head>
<body>

<div class="dash-nav">
  <div class="mark">LUMINA<span>·</span>FLIPS<span style="color:rgba(243,238,227,0.4);font-family:var(--sans);font-size:13px;margin-left:8px;">PORTAL</span></div>
  <button class="logout-btn" onclick="handleLogout()">Log Out</button>
</div>

<div class="dash-body" id="dashBody">
  <div class="dash-empty">Loading…</div>
</div>

<script>
  const SUPABASE_URL = "https://bazjxqyywzlachbjrrgo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhemp4cXl5d3psYWNoYmpycmdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODM1NDcsImV4cCI6MjEwMjY1OTU0N30.8EYLGHyvNigGckfJToYZBr5QqeB0rG9pb1qeNMq0KBg";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadDashboard(){
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){
      window.location.href = 'login.html';
      return;
    }

    const email = session.user.email;
    const body = document.getElementById('dashBody');

    // Which properties can this investor see?
    const { data: access } = await supabase
      .from('investor_access')
      .select('property_id, portal_properties(name)')
      .eq('email', email);

    if(!access || access.length === 0){
      body.innerHTML = '<div class="dash-empty">No properties linked to your account yet. Reach out if this seems wrong.</div>';
      return;
    }

    const propertyIds = access.map(a => a.property_id);

    const { data: updates } = await supabase
      .from('project_updates')
      .select('*')
      .in('property_id', propertyIds)
      .order('created_at', { ascending: false });

    if(!updates || updates.length === 0){
      body.innerHTML = '<div class="dash-empty">No updates posted yet — check back soon.</div>';
      return;
    }

    body.innerHTML = updates.map(u => `
      <div class="update-card">
        <div class="u-date">${new Date(u.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
        <div class="u-title">${u.title}</div>
        ${u.body ? `<div class="u-body">${u.body}</div>` : ''}
        ${u.photo_url ? `<img src="${u.photo_url}" alt="${u.title}">` : ''}
      </div>
    `).join('');
  }

  async function handleLogout(){
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  }

  loadDashboard();
</script>
</body>
</html>
